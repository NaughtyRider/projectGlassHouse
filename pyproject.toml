[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glasshouse"
version = "0.1.0"
description = "Guarded natural-language-to-SQL assistant for AML investigations"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "sqlglot>=25.0",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
eval = ["httpx>=0.27"]  # the eval runner drives the app through FastAPI's TestClient

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
glasshouse = ["fixtures/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]  # "." so tests can import the eval/ package
testpaths = ["tests"]
